[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kotsu-cli"
version = "0.1.1"
description = "Cozy personal finance in your terminal: income, expenses and installments of the month on one screen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.0,<9"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sera-DAI" }]
keywords = ["finance", "budget", "tui", "terminal", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Sera-DAI/kotsu"
Issues = "https://github.com/Sera-DAI/kotsu/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
kotsu = "kotsu.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kotsu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: left out of the quick checker (--quick)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
